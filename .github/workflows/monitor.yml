# データ精査役: 未読記事をGeminiでまとめて分析 → シグナルをDBに蓄積（通知はしない）
# 毎日 JST 9:10〜23:10 に2時間ごと（早朝分はdigestワークフローが配信直前に自前で分析する）
# cronはUTC指定: JST 9,11,...,23時 = UTC 0,2,...,14時
name: monitor

on:
  schedule:
    - cron: "10 0-14/2 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 決算集中日はバックログが15分を超える（2026-07-14実測: 459件の消化に4巡・約50分）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m monitor.agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
