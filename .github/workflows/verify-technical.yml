# テクニカル版 picks の成功基準を平日夜に自動判定（例外ベース監視）。
# 基準を割った時だけ ALERT_LINE_TO へLINE通知し、ジョブ自体も赤(exit1)にする。
# 平日 JST 21:00 = UTC 12:00（FB cron 19時台・technical_runs 記録後）。読み取りのみ。
name: verify-technical

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 直近7日（配信日基準）を対象に4基準を判定。割れたら --alert がLINE通知＋exit1。
      - run: python -m scripts.verify_technical --from "$(date -u -d '7 days ago' +%F)" --alert
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ALERT_LINE_TO: ${{ secrets.ALERT_LINE_TO }}
