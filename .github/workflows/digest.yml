# 通知役: 収集→分析→配信を直列実行し、たまったシグナルをリスト形式の1通にまとめてLINE配信
# 平日 JST 朝7:30（シグナルゼロの日もその旨を1通送る）
# 収集・分析はステップ単位でタイムアウト＆continue-on-errorとし、配信だけは必ず実行する
# cronはUTC指定: JST 月〜金 7:30 = UTC 日〜木 22:30
# GitHub Actionsのcronは遅延・スキップがあり発火時刻は保証されないが、
# 配信直前に収集・分析するため、何時に発火してもその時点の最新ニュースが乗る
name: digest

on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 収集（配信直前の最新ニュースを取り込む）
        run: python -m collector.agent
        timeout-minutes: 5
        continue-on-error: true
      - name: 分析（未読記事をシグナル化する）
        run: python -m monitor.agent
        timeout-minutes: 10
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
      - name: 配信（未通知シグナルをLINEに送る）
        run: python -m monitor.digest
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      - name: 捕捉率を確定（配信完了後・前営業日以前の暫定行を最新の配信状況で再判定）
        run: python -m feedback.agent --finalize
