{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>パイプライン統計</h2>
  <form method="get" action="/admin" style="margin-bottom:20px; display:flex; gap:10px; align-items:center">
    <input type="date" name="date" value="{{ date }}" onchange="this.form.submit()">
  </form>
  <div class="stats">
    <div class="stat">
      <div class="n">{{ stats.articles }}</div>
      <div class="l">収集記事</div>
    </div>
    <div class="stat">
      <div class="n">{{ stats.analyzed }}</div>
      <div class="l">分析済</div>
    </div>
    <div class="stat c-pos">
      <div class="n">{{ stats.signaled }}</div>
      <div class="l">シグナル化</div>
    </div>
    <div class="stat">
      <div class="n">{{ stats.notified }}</div>
      <div class="l">通知済</div>
    </div>
  </div>
  <div style="margin-top:16px">
    <a href="/admin/articles?date={{ date }}" class="btn btn-primary" style="font-size:0.85rem">この日の記事一覧を見る →</a>
  </div>
</div>

<div class="card">
  <h2>即時配信</h2>
  <p class="text-muted" style="margin: 0 0 14px">最新ニュースを<strong>収集→分析→配信</strong>まで一括実行します（本番の朝の処理と同じ）。シグナルがない場合は「該当なし」を送信します。完了まで数分かかることがあります。</p>
  <form method="post" action="/admin/notify">
    <button class="btn btn-success" type="submit">今すぐ収集して配信</button>
  </form>
</div>

{% endblock %}
