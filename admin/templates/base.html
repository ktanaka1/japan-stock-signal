<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}株シグナル 管理{% endblock %}</title>
  <!-- favicon: 絵文字をインラインSVGで表示（外部ファイル不要）。絵文字を差し替えれば変更可。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E💹%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f4f6f9; color: #333; font-size: 14px; }
    header { background: #1a1a2e; color: white; padding: 12px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; position: sticky; top: 0; z-index: 100; }
    header strong { font-size: 1rem; color: white; }
    header a { color: #9aa; text-decoration: none; font-size: 0.9rem; }
    header a:hover { color: white; }
    .main { max-width: 1300px; margin: 24px auto; padding: 0 24px; }
    .card { background: white; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07); max-width: 100%; }
    /* テーブルがカード幅を超えたらカード内部で横スクロール（ページ全体は揺らさない） */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* 株価フィルタのプリセット（クイック選択） */
    .preset { font-size: 0.78rem; padding: 2px 8px; margin-left: 4px; border: 1px solid #ccd; border-radius: 12px; background: #fff; color: #556; cursor: pointer; line-height: 1.6; }
    .preset:hover { background: #eef; border-color: #aab; }
    .preset.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
    .preset.preset-clear { color: #a44; border-color: #e0bcbc; }
    .preset.preset-clear:hover { background: #fbeaea; }
    .card h2 { margin: 0 0 16px; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .stats { display: flex; gap: 40px; flex-wrap: wrap; }
    .stat .n { font-size: 2rem; font-weight: 700; line-height: 1; }
    .stat .l { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .c-pos { color: #28a745; }
    .c-neg { color: #dc3545; }
    .c-neu { color: #6c757d; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 8px 12px; text-align: left; font-weight: 500; color: #666; border-bottom: 2px solid #e9ecef; white-space: nowrap; font-size: 0.82rem; }
    td { padding: 8px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
    tr:hover td { background: #fafbfd; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.78rem; white-space: nowrap; }
    .b-pos { background: #d4edda; color: #155724; }
    .b-neg { background: #f8d7da; color: #721c24; }
    .b-neu { background: #e2e3e5; color: #383d41; }
    .b-sig { background: #cce5ff; color: #004085; }
    .b-ntf { background: #fff3cd; color: #856404; }
    .b-none { background: #f8f9fa; color: #aaa; border: 1px solid #e9ecef; }
    .btn { display: inline-block; padding: 7px 16px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.88rem; text-decoration: none; font-family: inherit; }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0069d9; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    input[type=date], input[type=number], select { border: 1px solid #ced4da; border-radius: 4px; padding: 6px 10px; font-size: 0.88rem; font-family: inherit; }
    textarea { border: 1px solid #ced4da; border-radius: 4px; padding: 8px 10px; font-size: 0.88rem; font-family: monospace; width: 100%; resize: vertical; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; }
    .form-group small { color: #888; font-weight: normal; }
    .flash { padding: 10px 16px; border-radius: 5px; margin-bottom: 16px; font-size: 0.9rem; }
    .flash-ok  { background: #d4edda; color: #155724; }
    .flash-err { background: #f8d7da; color: #721c24; }
    .trunc { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    a { color: #007bff; }
    /* === フィルタ行：高さ40pxで統一・縦中央・gap16・件目は右端 === */
    .filters { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    .filters > form { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .filters > form > select,
    .filters > form > input,
    .filters .date-field > input[type=date],
    .filters > form > .date-toggle { height: 40px; box-sizing: border-box; }
    .filters > .count { margin-left: auto; white-space: nowrap; }
    /* 日付未指定トグル：リンク見えを避けてコントロール風に */
    .date-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; border: 1px solid #ced4da; border-radius: 4px; background: #fff; color: #555; font-size: 0.88rem; font-family: inherit; cursor: pointer; }
    .date-toggle:hover { background: #f1f3f5; }
    /* === 表示件数行：ラベルとセレクトを縦中央・高さ統一 === */
    .result-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
    .perpage { display: inline-flex; align-items: center; gap: 8px; }
    .perpage select { height: 40px; box-sizing: border-box; }
    /* === ページネーション：縦中央・gap統一・現在ページを強調 === */
    .pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .pager a, .pager .current { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 5px; text-decoration: none; box-sizing: border-box; }
    .pager a { color: #007bff; border: 1px solid #dee2e6; background: #fff; }
    .pager a:hover { background: #f1f3f5; }
    .pager .current { background: #007bff; color: #fff; border: 1px solid #007bff; font-weight: 600; }
    .pager .nav { padding: 0 14px; }
    .pager .ellipsis { color: #999; padding: 0 2px; }
    /* 日付入力欄の中にクリア（×）ボタンを重ねる */
    .date-field { position: relative; display: inline-flex; align-items: center; }
    .date-field input.has-value { padding-right: 46px; }
    .date-clear { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: #c4c9d0; color: #fff; font-size: 12px; line-height: 16px; text-align: center; cursor: pointer; }
    .date-clear:hover { background: #9aa0a8; }
    .text-muted { color: #999; }
    .checkbox-group label { display: inline-flex; align-items: center; gap: 6px; font-weight: normal; margin-right: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <strong>株シグナル 管理</strong>
    <a href="/admin">ダッシュボード</a>
    <a href="/admin/articles">記事一覧</a>
    <a href="/admin/backtest">元本シミュレーション</a>
    <a href="/admin/settings">条件設定</a>
    <a href="/admin/logout" style="margin-left:auto">ログアウト</a>
  </header>
  <div class="main">
    {% if msg %}<div class="flash flash-ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash flash-err">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
