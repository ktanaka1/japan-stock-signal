<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ログイン - 株シグナル管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #333; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: white; border-radius: 10px; padding: 36px 40px; width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
    .box h1 { font-size: 1.1rem; margin: 0 0 24px; text-align: center; }
    .box input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 5px; font-size: 1rem; margin-bottom: 16px; }
    .box button { width: 100%; padding: 11px; border: none; border-radius: 5px; background: #007bff; color: white; font-size: 1rem; cursor: pointer; }
    .box button:hover { background: #0069d9; }
    .err { background: #f8d7da; color: #721c24; padding: 9px 12px; border-radius: 5px; font-size: 0.88rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>株シグナル 管理</h1>
    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="password" name="token" placeholder="アクセストークン" autofocus required>
      <button type="submit">ログイン</button>
    </form>
  </div>
</body>
</html>
