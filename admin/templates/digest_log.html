{% extends "base.html" %}
{% from "_logs.html" import digest_table %}
{% block title %}配信ログ - 株シグナル管理{% endblock %}
{% block content %}

<div class="card">
  <h2>配信ログ</h2>
  {{ digest_table(runs, paged=(page > 1)) }}

  <div class="pager" style="margin-top:18px; margin-bottom:0; justify-content:space-between">
    <span>
      {% if page > 1 %}<a class="nav" href="/admin/digest-log?page={{ page - 1 }}">← 前へ</a>{% endif %}
    </span>
    <span class="text-muted" style="font-size:0.85rem">ページ {{ page }}</span>
    <span>
      {% if has_next %}<a class="nav" href="/admin/digest-log?page={{ page + 1 }}">次へ →</a>{% endif %}
    </span>
  </div>
</div>

{% endblock %}
